# いさバス 中継サーバー（proxy/）を Cloudflare Workers に設置する。
# リポジトリの Settings → Secrets and variables → Actions に、次の3つを登録しておく:
#   CLOUDFLARE_API_TOKEN   Cloudflare の API トークン（「Edit Cloudflare Workers」テンプレートで作成）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウント ID
#   ODPT_TOKEN             ODPT のアクセストークン（中継サーバーの秘密の設定にだけ入る）
name: 中継サーバーを設置

on:
  push:
    branches: [main]
    paths: ["proxy/**", ".github/workflows/proxy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 秘密の値がそろっているか確認
        id: check
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.ODPT_TOKEN }}
        run: |
          missing=""
          [ -n "$A" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$B" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$C" ] || missing="$missing ODPT_TOKEN"
          # そろっていなければ設置せずに終える（失敗扱いにはしない）
          if [ -n "$missing" ]; then echo "::notice::次の秘密の値が未登録のため、設置をとばしました:$missing"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: 設置
        if: steps.check.outputs.ok == 'true'
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy
      - name: トークンを中継サーバーの秘密の設定に入れる
        if: steps.check.outputs.ok == 'true'
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ODPT_TOKEN: ${{ secrets.ODPT_TOKEN }}
        run: printf '%s' "$ODPT_TOKEN" | npx --yes wrangler@3 secret put ODPT_TOKEN
