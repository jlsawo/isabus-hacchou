<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 画面上部の「いさバス」の横に出す小さなマーク。アイコンと同じ絵だが、
       小さくても「いさ」が読めるよう、バスを大きくして行先表示の字を太く大きくしてある -->
  <rect width="512" height="512" rx="96" fill="#3f9a5c"/>
  <g transform="translate(256 262)">
    <!-- 車体 -->
    <rect x="-200" y="-210" width="400" height="390" rx="60" fill="#ffffff"/>
    <rect x="-200" y="90" width="400" height="90" fill="#f7b8cb"/>
    <rect x="-200" y="110" width="400" height="70" rx="60" fill="#f7b8cb"/>
    <!-- 行先表示 -->
    <rect x="-176" y="-186" width="352" height="160" rx="22" fill="#06303a"/>
    <text x="0" y="-60" text-anchor="middle" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Maru Gothic ProN',sans-serif"
          font-size="140" font-weight="900" fill="#ffd24a">いさ</text>
    <!-- 窓 -->
    <rect x="-176" y="-8" width="352" height="86" rx="18" fill="#9fe3ee"/>
    <!-- ライト -->
    <circle cx="-140" cy="134" r="24" fill="#fff4c2"/>
    <circle cx="140" cy="134" r="24" fill="#fff4c2"/>
    <!-- タイヤ -->
    <rect x="-176" y="176" width="72" height="40" rx="14" fill="#06303a"/>
    <rect x="104" y="176" width="72" height="40" rx="14" fill="#06303a"/>
  </g>
</svg>
