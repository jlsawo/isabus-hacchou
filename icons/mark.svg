<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 画面上部の「いさバス」の横に出す丸いマーク。アイコンと同じ絵だが、
       小さくても「いさ」が読めるよう、バスを大きくして行先表示の字を太く大きくしてある -->
  <circle cx="256" cy="256" r="256" fill="#3f9a5c"/>
  <g transform="translate(256 262)">
    <!-- 車体 -->
    <rect x="-172" y="-180" width="344" height="334" rx="54" fill="#ffffff"/>
    <rect x="-172" y="76" width="344" height="78" fill="#f7b8cb"/>
    <rect x="-172" y="94" width="344" height="60" rx="54" fill="#f7b8cb"/>
    <!-- 行先表示 -->
    <rect x="-152" y="-160" width="304" height="138" rx="20" fill="#06303a"/>
    <text x="0" y="-50" text-anchor="middle" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Maru Gothic ProN',sans-serif"
          font-size="122" font-weight="900" fill="#ffd24a">いさ</text>
    <!-- 窓 -->
    <rect x="-152" y="-6" width="304" height="72" rx="16" fill="#9fe3ee"/>
    <!-- ライト -->
    <circle cx="-118" cy="114" r="21" fill="#fff4c2"/>
    <circle cx="118" cy="114" r="21" fill="#fff4c2"/>
    <!-- タイヤ -->
    <rect x="-150" y="150" width="62" height="34" rx="12" fill="#06303a"/>
    <rect x="88" y="150" width="62" height="34" rx="12" fill="#06303a"/>
  </g>
</svg>
